description: Diese OER vermittelt datengestützte Methoden der Filmanalyse mit digitalen
  Annotationswerkzeugen. Anhand eines Online-Videos zur Klimakrise werden audiovisuelle
  Inszenierungsmuster analysiert, um affektive Rhetoriken politischer Zielsetzungen
  zu erkennen und zu verstehen.
